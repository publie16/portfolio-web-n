<!DOCTYPE html>
<html lang="en" class="transition-colors duration-500">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact | Pubali Dutta</title>

  <!-- Preserve dark mode -->
  <script>
    if (localStorage.theme === 'dark') {
      document.documentElement.classList.add('dark');
    }
  </script>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { darkMode: 'class' };
  </script>
</head>

<body class="bg-gray-100 text-gray-900 dark:bg-[#000000] dark:text-white transition-colors duration-500">

  <!-- Navbar -->
  <nav class="flex justify-between items-center px-8 py-4 bg-[#e1d5d2] text-black shadow-md fixed w-full top-0 z-50 dark:bg-[#1e1e1e] dark:text-white transition-colors duration-500">
    <h1 class="text-2xl flex items-center">
      MyPortf
      <button 
        id="theme-toggle" 
        class="ml-1 text-3xl bg-transparent border-none outline-none focus:outline-none hover:scale-110 transition-transform duration-150 ease-in-out delay-100"
      >
        🌖
      </button>
      lio
    </h1>

    <div class="space-x-6">
      <a href="./index.html" class="hover:text-[#ff1493] transition-colors duration-150 ease-in-out delay-100">Home</a>
      <a href="./skills.html" class="hover:text-[#ff1493] transition-colors duration-150 ease-in-out delay-100">Skills</a>
      <a href="./projects.html" class="hover:text-[#ff1493] transition-colors duration-150 ease-in-out delay-100">Projects</a>
      <a href="#contact" class="text-[#ff1493] transition-colors duration-150 ease-in-out delay-100">Contact</a>
    </div>
  </nav>

  <!-- Contact Section -->
  <section id="contact" class="pt-28 pb-16 px-6 bg-gray-100 dark:bg-[#0e0e0e] transition-colors duration-500">
    <div class="max-w-3xl mx-auto bg-white dark:bg-[#1e1e1e] shadow-xl rounded-2xl p-8 border border-transparent dark:border-[#333] transition-colors duration-500">
      <h2 class="text-3xl font-thin text-center mb-10 text-[#ff1493]">Contact Me</h2>

      <form id="contactForm" class="space-y-6">
        <!-- Name -->
        <div>
          <label for="name" class="block text-sm font-medium mb-1 text-gray-700 dark:text-gray-300">Full Name</label>
          <input type="text" id="name" name="name"
            class="w-full border border-gray-300 dark:border-gray-600 dark:bg-[#0e0e0e] dark:text-white rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-[#ff1493] transition-colors duration-500"
            placeholder="Your Name" required />
        </div>

        <!-- Email -->
        <div>
          <label for="email" class="block text-sm font-medium mb-1 text-gray-700 dark:text-gray-300">Email Address</label>
          <input type="email" id="email" name="email"
            class="w-full border border-gray-300 dark:border-gray-600 dark:bg-[#0e0e0e] dark:text-white rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-[#ff1493] transition-colors duration-500"
            placeholder="you@example.com" required />
        </div>

        <!-- Subject -->
        <div>
          <label for="subject" class="block text-sm font-medium mb-1 text-gray-700 dark:text-gray-300">Subject</label>
          <input type="text" id="subject" name="subject"
            class="w-full border border-gray-300 dark:border-gray-600 dark:bg-[#0e0e0e] dark:text-white rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-[#ff1493] transition-colors duration-500"
            placeholder="What is this about?" required />
        </div>

        <!-- Message -->
        <div>
          <label for="message" class="block text-sm font-medium mb-1 text-gray-700 dark:text-gray-300">Message</label>
          <textarea id="message" name="message" rows="5"
            class="w-full border border-gray-300 dark:border-gray-600 dark:bg-[#0e0e0e] dark:text-white rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-[#ff1493] transition-colors duration-500"
            placeholder="Write your message here..." required></textarea>
        </div>

        <!-- Submit Button -->
        <div class="text-center">
          <button type="submit"
            class="bg-[#ff1493] text-white font-semibold px-6 py-2 rounded-lg hover:bg-pink-600 transition duration-300">
            Send Message
          </button>
        </div>
      </form>

      <!-- Success/Error Message -->
      <p id="formMessage" class="text-center mt-4 text-sm text-gray-600 dark:text-gray-400"></p>
    </div>
  </section>

  <script src="./theme.js"></script>
  <script src="./script.js"></script>
</body>
</html>
